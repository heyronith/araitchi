name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Secret leak check
        run: pnpm check:secrets
        shell: bash

      - name: Secret leak self-test
        run: pnpm check:secrets:selftest
        shell: bash

      - name: Install Playwright Chromium
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec playwright install chromium --with-deps

      - name: End-to-end tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
