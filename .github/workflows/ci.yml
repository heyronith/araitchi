name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Validate bench fixtures (offline)
        run: pnpm bench:validate-fixtures

      - name: Bench dry-run
        run: pnpm bench --dry-run --sets 1 --configs A --limit 2 --repeats 1

      - name: Secret leak check
        run: pnpm check:secrets
        shell: bash

      - name: Secret leak self-test
        run: pnpm check:secrets:selftest
        shell: bash

      - name: Install Playwright Chromium
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec playwright install chromium --with-deps

      - name: End-to-end tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # install.sh enables corepack + pnpm; do not cache via packageManager yet
          package-manager-cache: false

      - name: Fresh install via scripts/install.sh
        run: bash scripts/install.sh

      - name: Start server and hit /api/health
        run: |
          set -euo pipefail
          node scripts/start.mjs --no-open &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/health | grep -q '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check timed out after 90s" >&2
          exit 1
